name: internal-task-tracker

x-backend: &backend
  image: internal-task-tracker-api:local
  build:
    context: ./backend
    target: runtime
  init: true

x-environment: &environment
  APP_ENV: ${APP_ENV:-local}
  DATABASE_URL: postgresql+asyncpg://tracker:${POSTGRES_PASSWORD:?Generate .env first}@db:5432/tracker
  JWT_SECRET: ${JWT_SECRET:?Generate .env first}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
  SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
  API_LOCK_TIMEOUT_MS: ${API_LOCK_TIMEOUT_MS:-3000}
  LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-10}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DOCS_ENABLED: ${DOCS_ENABLED:-true}

services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: tracker_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Generate .env first}
      POSTGRES_DB: tracker
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U tracker_owner -d tracker']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  migrate:
    <<: *backend
    environment:
      <<: *environment
      MIGRATION_DATABASE_URL: postgresql+asyncpg://tracker_owner:${POSTGRES_OWNER_PASSWORD:?Generate .env first}@db:5432/tracker
    command: [alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  backend:
    <<: *backend
    environment:
      <<: *environment
    ports:
      - '127.0.0.1:${API_PORT:-8000}:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  seed:
    <<: *backend
    profiles: [tools]
    environment:
      <<: *environment
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    command: [python, -m, app.cli.seed]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

volumes:
  postgres_data:
