[project]
name = "internal-task-tracker-api"
version = "0.1.0"
description = "FastAPI foundation for the Internal Task Tracker"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "email-validator>=2,<3",
  "fastapi>=0.115,<1",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "pyjwt>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "tzdata>=2026.3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = ["integration: requires an explicitly configured, isolated PostgreSQL TEST_DATABASE_URL"]
