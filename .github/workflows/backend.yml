name: Backend checks

on:
  pull_request:
  push:
    branches: [release, main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: tracker_owner
          POSTGRES_PASSWORD: ci-only-owner-password
          POSTGRES_DB: tracker_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tracker_owner -d tracker_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+asyncpg://tracker:ci-only-runtime-password@localhost:5432/tracker_test
      TEST_MIGRATION_DATABASE_URL: postgresql+asyncpg://tracker_owner:ci-only-owner-password@localhost:5432/tracker_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.3'
          python-version: '3.13.15'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: Provision isolated CI runtime role
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -U tracker_owner -d tracker_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE tracker LOGIN PASSWORD 'ci-only-runtime-password';
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT USAGE ON SCHEMA public TO tracker;
          ALTER DEFAULT PRIVILEGES FOR ROLE tracker_owner IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO tracker;
          ALTER DEFAULT PRIVILEGES FOR ROLE tracker_owner IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO tracker;
          SQL
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest
      - run: uv run python -m app.cli.export_openapi --check

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.3'
          python-version: '3.13.15'
      - name: Generate local-only configuration
        working-directory: backend
        run: uv run --frozen python -m app.cli.init_env
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180 backend
      - run: docker compose run --rm seed
      - name: Verify persistent data after restart
        run: |
          docker compose restart db backend
          docker compose up --wait --wait-timeout 90 backend
          docker compose run --rm seed
          curl --fail http://localhost:8000/api/v1/health/ready
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=120 backend migrate db
      - name: Cleanup ephemeral CI environment
        if: always()
        run: docker compose down --volumes
