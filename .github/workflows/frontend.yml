name: Frontend checks
on:
  pull_request:
    paths: ['frontend/**', 'compose.yaml', 'docs/api/openapi.json', '.github/workflows/frontend.yml']
  push:
    branches: [develop, develop-front, release, main]
    paths: ['frontend/**', 'compose.yaml', 'docs/api/openapi.json', '.github/workflows/frontend.yml']
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run api:check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:unit -- --run
      - run: npm run build
      - name: Build frontend container
        run: docker build --tag internal-task-tracker-frontend:ci .
      - name: Validate Nginx configuration
        run: docker run --rm internal-task-tracker-frontend:ci nginx -t
